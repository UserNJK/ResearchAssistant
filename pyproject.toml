[project]
name = "research-assistant"
version = "0.1.0"
description = "AI-powered research assistant for searching, reading, and analyzing research papers"
readme = "README.md"
requires-python = ">=3.8"
authors = [ { name = "Research Assistant Team" } ]
urls = { "Homepage" = "https://github.com/UserNJK/ResearchAssistant" }
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "ddgs>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=4.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "markdown>=3.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tenacity>=8.2.0",
]

[project.scripts]
research-assistant = "research_assistant.cli:main"

[build-system]
requires = ["pdm-pep517>=0.13.0"]
build-backend = "pdm.pep517.api"

[tool.pdm]
# Keep lockfile settings default; contributors should run `pdm lock` locally
